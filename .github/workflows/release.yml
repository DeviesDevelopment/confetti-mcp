name: Release

on:
  push:
    tags: ['v*']
  # Nothing else exercises this workflow, so an action bump here is unverified
  # until the next real release — which is also the thing that deploys to
  # production. A dry run does everything except authenticate and push, so a
  # dependency update can be proven on a branch before it is trusted with a tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and smoke-test only; do not log in or push'
        type: boolean
        default: true

# Every action is pinned to a full commit SHA: this job holds DOCKERHUB_TOKEN,
# and a Docker Hub webhook auto-deploys whatever it pushes, so a force-pushed
# major tag on any of these actions would reach production directly. The
# trailing comment is the version that SHA is; resolve a new one with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (deref .object.sha through /git/tags/<sha> for annotated tags) — never by
# reading it off a web page.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: Lint and typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The tests above run on the runner's glibc Node, against source. They say
      # nothing about the artifact that ships. Build the platform Azure runs,
      # load it into the local daemon, and boot it before anything is pushed.
      - name: Build linux/amd64 for smoke test (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: confetti-mcp:smoke
          # `load` exports to the docker daemon, which cannot carry attestations.
          provenance: false
          # Its own scope. This build is amd64-only, so sharing a scope with the
          # multi-arch push lets its mode=max export evict the arm64 layers —
          # which turned a 2-minute release into a 30-minute timeout once.
          cache-from: type=gha,scope=smoke-amd64
          cache-to: type=gha,mode=max,scope=smoke-amd64

      # Keep in sync with the identical step in ci.yml.
      - name: Smoke-test the image
        run: |
          set -euo pipefail

          fail() {
            echo "smoke: FAIL: $1"
            docker logs confetti-mcp-smoke 2>&1 | tail -50 || true
            docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
            exit 1
          }

          docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
          docker run -d --name confetti-mcp-smoke -p 18080:8080 confetti-mcp:smoke >/dev/null

          BODY=""
          for _ in $(seq 1 30); do
            if BODY="$(curl -fsS -m 2 http://127.0.0.1:18080/ 2>/dev/null)"; then break; fi
            BODY=""
            [ "$(docker inspect -f '{{.State.Running}}' confetti-mcp-smoke)" = "true" ] ||
              fail "the container exited before it answered GET /"
            sleep 1
          done
          [ -n "$BODY" ] || fail "GET / never answered within 30s"

          echo "smoke: GET / -> $BODY"
          FLAT="$(printf '%s' "$BODY" | tr -d ' \n\t')"
          printf '%s' "$FLAT" | grep -q '"status":"ok"' || fail "GET / is not the identity JSON"
          printf '%s' "$FLAT" | grep -q '"server":"confetti-mcp"' || fail "GET / is not the identity JSON"
          VERSION="$(jq -r .version package.json)"
          printf '%s' "$FLAT" | grep -q "\"version\":\"$VERSION\"" ||
            fail "the image reports a version other than $VERSION — it was built from stale source"

          CODE="$(curl -s -o /dev/null -w '%{http_code}' -m 5 -X POST http://127.0.0.1:18080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')"
          [ "$CODE" = "401" ] || fail "POST /mcp with no API key returned $CODE, expected 401"
          echo "smoke: POST /mcp with no key -> 401"

          docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
          echo "smoke: PASS"

      # Deliberately after the smoke test: a build that never boots must never
      # get as far as authenticating to the registry.
      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        if: ${{ !inputs.dry_run }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: deviesdevelopment/confetti-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Same context, same Dockerfile, same buildx cache as the smoke build, so
      # the amd64 layers published here are the ones that just booted. The
      # arm64 variant is still built under QEMU and never executed.
      - name: Build and push
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-multiarch
          cache-to: type=gha,mode=max,scope=release-multiarch

  # Deploy is a separate job so the image is published even if the rollout fails,
  # and so it can be re-run alone. It authenticates with a short-lived OIDC token
  # bound to this repo's `production` environment — there is no standing
  # credential anywhere, which is the point: the previous Docker Hub webhook
  # embedded App Service publishing credentials that also granted Kudu shell
  # access, stored outside any secret manager.
  #
  # Every identifier is a secret, so nothing here names the instance. They are
  # masked in logs; the endpoint is publicly reachable by design, so this stops
  # the repo advertising it rather than making it private.
  deploy:
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Authenticate to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pin the exact version just published, never `latest`: the app stops
      # following a mutable tag, so a rogue push to `latest` cannot deploy.
      - name: Deploy the published image
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          az webapp config container set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --container-image-name "deviesdevelopment/confetti-mcp:$VERSION" \
            --output none
          echo "requested rollout of $VERSION"

      # A webhook deploy was invisible and unverified. Fail the release if the
      # running app never reports the version it was told to run.
      - name: Verify the rollout
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 40); do
            RUNNING="$(curl -fsS -m 10 "${{ secrets.AZURE_WEBAPP_URL }}/" 2>/dev/null | jq -r .version 2>/dev/null || echo '')"
            if [ "$RUNNING" = "$VERSION" ]; then
              echo "rollout confirmed: running $VERSION"
              exit 0
            fi
            sleep 15
          done
          echo "rollout not confirmed after 10 minutes; last reported version: '$RUNNING'"
          exit 1
