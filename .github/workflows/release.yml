name: Release

on:
  push:
    tags: ['v*']

# Every action is pinned to a full commit SHA: this job holds DOCKERHUB_TOKEN,
# and a Docker Hub webhook auto-deploys whatever it pushes, so a force-pushed
# major tag on any of these actions would reach production directly. The
# trailing comment is the version that SHA is; resolve a new one with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
# (deref .object.sha through /git/tags/<sha> for annotated tags) — never by
# reading it off a web page.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci --ignore-scripts

      - name: Lint and typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The tests above run on the runner's glibc Node, against source. They say
      # nothing about the artifact that ships. Build the platform Azure runs,
      # load it into the local daemon, and boot it before anything is pushed.
      - name: Build linux/amd64 for smoke test (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: confetti-mcp:smoke
          # `load` exports to the docker daemon, which cannot carry attestations.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep in sync with the identical step in ci.yml.
      - name: Smoke-test the image
        run: |
          set -euo pipefail

          fail() {
            echo "smoke: FAIL: $1"
            docker logs confetti-mcp-smoke 2>&1 | tail -50 || true
            docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
            exit 1
          }

          docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
          docker run -d --name confetti-mcp-smoke -p 18080:8080 confetti-mcp:smoke >/dev/null

          BODY=""
          for _ in $(seq 1 30); do
            if BODY="$(curl -fsS -m 2 http://127.0.0.1:18080/ 2>/dev/null)"; then break; fi
            BODY=""
            [ "$(docker inspect -f '{{.State.Running}}' confetti-mcp-smoke)" = "true" ] ||
              fail "the container exited before it answered GET /"
            sleep 1
          done
          [ -n "$BODY" ] || fail "GET / never answered within 30s"

          echo "smoke: GET / -> $BODY"
          FLAT="$(printf '%s' "$BODY" | tr -d ' \n\t')"
          printf '%s' "$FLAT" | grep -q '"status":"ok"' || fail "GET / is not the identity JSON"
          printf '%s' "$FLAT" | grep -q '"server":"confetti-mcp"' || fail "GET / is not the identity JSON"
          VERSION="$(jq -r .version package.json)"
          printf '%s' "$FLAT" | grep -q "\"version\":\"$VERSION\"" ||
            fail "the image reports a version other than $VERSION — it was built from stale source"

          CODE="$(curl -s -o /dev/null -w '%{http_code}' -m 5 -X POST http://127.0.0.1:18080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')"
          [ "$CODE" = "401" ] || fail "POST /mcp with no API key returned $CODE, expected 401"
          echo "smoke: POST /mcp with no key -> 401"

          docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
          echo "smoke: PASS"

      # Deliberately after the smoke test: a build that never boots must never
      # get as far as authenticating to the registry.
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: deviesdevelopment/confetti-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Same context, same Dockerfile, same buildx cache as the smoke build, so
      # the amd64 layers published here are the ones that just booted. The
      # arm64 variant is still built under QEMU and never executed.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
