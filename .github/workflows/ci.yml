name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs with the version in a trailing
# comment; see the header of release.yml for how to resolve a new one.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint and typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # `load` so the next step can actually run it. A build that succeeds and
      # a container that boots are different claims.
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: confetti-mcp:ci
          # `load` exports to the docker daemon, which cannot carry attestations.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep in sync with the identical step in release.yml.
      - name: Smoke-test the image
        run: |
          set -euo pipefail

          fail() {
            echo "smoke: FAIL: $1"
            docker logs confetti-mcp-smoke 2>&1 | tail -50 || true
            docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
            exit 1
          }

          docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
          docker run -d --name confetti-mcp-smoke -p 18080:8080 confetti-mcp:ci >/dev/null

          BODY=""
          for _ in $(seq 1 30); do
            if BODY="$(curl -fsS -m 2 http://127.0.0.1:18080/ 2>/dev/null)"; then break; fi
            BODY=""
            [ "$(docker inspect -f '{{.State.Running}}' confetti-mcp-smoke)" = "true" ] ||
              fail "the container exited before it answered GET /"
            sleep 1
          done
          [ -n "$BODY" ] || fail "GET / never answered within 30s"

          echo "smoke: GET / -> $BODY"
          FLAT="$(printf '%s' "$BODY" | tr -d ' \n\t')"
          printf '%s' "$FLAT" | grep -q '"status":"ok"' || fail "GET / is not the identity JSON"
          printf '%s' "$FLAT" | grep -q '"server":"confetti-mcp"' || fail "GET / is not the identity JSON"
          VERSION="$(jq -r .version package.json)"
          printf '%s' "$FLAT" | grep -q "\"version\":\"$VERSION\"" ||
            fail "the image reports a version other than $VERSION — it was built from stale source"

          CODE="$(curl -s -o /dev/null -w '%{http_code}' -m 5 -X POST http://127.0.0.1:18080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')"
          [ "$CODE" = "401" ] || fail "POST /mcp with no API key returned $CODE, expected 401"
          echo "smoke: POST /mcp with no key -> 401"

          docker rm -f confetti-mcp-smoke >/dev/null 2>&1 || true
          echo "smoke: PASS"
